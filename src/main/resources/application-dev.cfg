# Local development override, loaded automatically ON TOP of application.cfg by the
# engine's own config loader (ConfigurationImpl.init loads "application.cfg" then
# "application-dev.cfg", silently skipping the second if it is absent - see
# EnPustTil.onCreate / application.cfg for the full explanation). Restores exactly the
# windowed, verbose dev experience "./gradlew run" has always had.
#
# This file is EXCLUDED from the Windows release build by the existing
# exclude("*-dev*") line in build.gradle.kts's `jar` task (the same mechanism that
# already keeps init-dev.pes out of the release), so the shipped .exe never sees these
# overrides and always boots into booth mode from application.cfg alone.
#
# THE DEV WINDOW IS 16:9, AND THAT IS NOT A COSMETIC CHOICE.
#
# It was 1200x900 - 4:3 - and that aspect ratio hides two real defects, because of how the
# camera is built. render/CameraRig.kt scales at framebufferHeight / Framing.VISIBLE_DEPTH_METRES
# up to the design aspect of 1.6419, so at or below that exactly 60 m of water is visible
# vertically and a wider display shows more water SIDEWAYS. At 4:3 the visible width is
# therefore 60 * 4/3 = 80.0 m, and dive.Tuning.COLUMN_HALF_WIDTH is 40 m - so the play
# column is exactly as wide as the window, to the metre, and both of its edges sit
# precisely on the screen border where nothing can be seen at them.
#
# ABOVE 1.6419 THE WIDTH BINDS INSTEAD, and the paragraph above stops being the whole story.
# The 2026-08-12 cliff-art cap made pixelsPerMetre the LARGER of a height fit and a width fit
# (Framing.VISIBLE_WIDTH_METRES = 98.516 m, i.e. exactly one cliff sprite at each end), so
# visible DEPTH falls off as 98.516/aspect past that point: 4:3 and 16:10 keep the full 60 m,
# but this window's own 16:9 shows 55.42 m, not 60. That is a deliberate gameplay trade the
# owner took twice - see the design spec's section 17. Do not restore "60 m on every display"
# to this file; it was true when it was written and has not been since.
#
# Two things were invisible for that reason and became obvious the moment the window was
# widened: the rock walls (drawn outside +-COLUMN_HALF_WIDTH, so entirely off-frame at
# 4:3), and the hard vertical seam the god rays used to leave at the column boundary -
# measured at 36/255 at exactly world -40.0 m, and fixed there by a wall fade. The god rays
# were removed on 2026-08-17; the rock walls are reason enough on their own, and the general
# point stands - a 4:3 preview cannot see the edges of the play column at all.
#
# 16:9 gives 60 * 16/9 = 106.7 m of visible width, i.e. 13.3 m of water outside the column
# on each side, which is where both of those live. A booth display is far more likely to be
# 16:9 than 4:3, so this is also simply the more honest preview. Nothing in the game
# depends on the number - the world is resolution- and aspect-independent by construction
# (CameraRig, Framing) and CameraInvariants checks that on the real framebuffer under
# EPT_DEV - so this only decides what a developer happens to be looking at.
windowWidth = 1600
windowHeight = 900
screenMode = WINDOWED
logLevel = DEBUG
