# Local development override, loaded automatically ON TOP of application.cfg by the
# engine's own config loader (ConfigurationImpl.init loads "application.cfg" then
# "application-dev.cfg", silently skipping the second if it is absent - see
# EnPustTil.onCreate / application.cfg for the full explanation). Restores exactly the
# windowed, verbose dev experience "./gradlew run" has always had.
#
# This file is EXCLUDED from the Windows release build by the existing
# exclude("*-dev*") line in build.gradle.kts's `jar` task (the same mechanism that
# already keeps init-dev.pes out of the release), so the shipped .exe never sees these
# overrides and always boots into booth mode from application.cfg alone.
windowWidth = 1200
windowHeight = 900
screenMode = WINDOWED
logLevel = DEBUG
