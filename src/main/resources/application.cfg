gameName = EnPustTil
targetFps = 120

# Booth default: this file ships in the release .exe (buildWin64Release), so it must be
# safe to run unattended in front of a queue for two days. FULLSCREEN removes the title
# bar/close button that any attendee could otherwise drag or close, and a quieter log
# level avoids two days of DEBUG spam. See application-dev.cfg for the local override -
# screenMode and window size cannot be changed at runtime (no setter reaches the window
# once it is created), so this split, not an env var, is what makes booth mode "the
# default for a release build". See EnPustTil.onCreate for the one thing that IS
# runtime-gated (EPT_DEV): MetricViewer, and logLevel as a belt-and-braces on-site
# override even against a built release .exe. No windowWidth/windowHeight here,
# deliberately: FULLSCREEN with no pinned size takes the display's native resolution
# instead of a guessed one, and the game is resolution-independent by construction
# (see render/CameraRig.kt, which derives the world scale from the actual surface height).
#
# DAY TWO: change dailySeed below to a different number and restart the .exe. The
# fresh seed generates a new water column (see dive/PearlColumn.generate/DiveSim),
# and since every score record stores the seed it was earned under (score/ScoreEntry),
# the attract-screen leaderboard (EnPustTil.drawLeaderboard, scoped to todaySeed) shows
# only day two's scores from that point on — day one's board is left intact in
# scoreboard.json under the old seed, just no longer displayed. The active seed is also
# shown on the attract screen's status line (SEED <n>) as a way to check the switch took
# without reading a log.
#
# THE VALUE MUST BE A WHOLE NUMBER UNDER 2147483647 (Int.MAX_VALUE) — TEN DIGITS OR
# FEWER. This is not a style preference: application.cfg's own loader type-coerces every
# value before storing it (all-digits -> Integer, digits-with-one-dot -> Float, anything
# else -> String), and going ABOVE ten digits does not just fail to parse — the coercion
# throws while the file is being read and the throw is NOT caught per-line, so parsing
# THE WHOLE FILE aborts and EVERY key below (screenMode, logLevel, the button map, all of
# it) silently reverts to its compiled default for that run, not just this one. A decimal
# point is a typo for the same reason (a seed is never fractional) and degrades safely —
# it falls back to whatever seed was already active — but a value this long does not.
# dailySeed = 20260903
screenMode = FULLSCREEN
logLevel = WARN

# BUTTON MAP. The booth encoder is a generic USB arcade board and its button codes are a
# guess until one is enumerated on Windows. If kick, bleed or start land on the wrong
# physical button on setup day, change them here and restart the .exe - no rebuild, no
# toolchain. Valid names are GamepadButton's entries, verified against the jar: A, B, X, Y,
# LEFT_BUMPER, RIGHT_BUMPER, BACK, START, GUIDE, LEFT_THUMB, RIGHT_THUMB, DPAD_UP,
# DPAD_RIGHT, DPAD_DOWN, DPAD_LEFT, and the PlayStation aliases CROSS, CIRCLE, SQUARE,
# TRIANGLE. LAST is also accepted (parseGamepadButton has no carve-out for it) but is an
# alias for DPAD_LEFT, not a button of its own - verified from the jar, same construction
# as the PlayStation aliases above - so write DPAD_LEFT instead; LAST works but names
# nothing a technician standing at the cabinet would recognise.
#
# An unknown or misspelled name falls back to the compiled default rather than leaving
# the button unbound - see parseGamepadButton - and the fallback is LOGGED (at WARN, so it
# reaches this file's own logLevel and the booth log written at start-up, booth/BoothLog.kt)
# rather than happening silently: a typo and a deliberate "use the default" edit would
# otherwise be indistinguishable. Two of these landing on the same physical button (a
# four-line copy-paste mistake) is ALSO logged, for the same reason. Run with EPT_DEV=1 to
# see which codes the encoder actually reports (the gamepad diagnostic overlay) if none of
# the names below turn out to be it.
# kickButton = A
# bleedButton = B
# restartButton = START
# restartButtonAlt = A
#
# stickDeadzone: a whole number ("0" to disable it entirely) or a decimal ("0.2", "0.35",
# ...) both work - clamped to 0..0.9 either way.
# stickDeadzone = 0.2
