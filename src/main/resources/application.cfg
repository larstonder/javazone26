# Do not edit or remove this line. EnPustTil.configFileHealthWarning reads it back at
# startup and compares it against the compiled name as a cheap (and only SPECULATIVE -
# see that function's doc) check that this file loaded completely; changing or deleting
# it fires that warning with nothing actually broken.
gameName = EnPustTil
targetFps = 120

# Booth default: this file ships in the release .exe (buildWin64Release), so it must be
# safe to run unattended in front of a queue for two days. FULLSCREEN removes the title
# bar/close button that any attendee could otherwise drag or close, and a quieter log
# level avoids two days of DEBUG spam. See application-dev.cfg for the local override -
# screenMode and window size cannot be changed at runtime (no setter reaches the window
# once it is created), so this split, not an env var, is what makes booth mode "the
# default for a release build". See EnPustTil.onCreate for the one thing that IS
# runtime-gated (EPT_DEV): MetricViewer, and logLevel as a belt-and-braces on-site
# override even against a built release .exe. No windowWidth/windowHeight here,
# deliberately: FULLSCREEN with no pinned size takes the display's native resolution
# instead of a guessed one, and the game is resolution-independent by construction
# (see render/CameraRig.kt, which derives the world scale from the actual surface height).
#
# DAY TWO: change dailySeed below to a different number and restart the .exe. The
# fresh seed generates a new water column (see dive/PearlColumn.generate/DiveSim),
# and since every score record stores the seed it was earned under (score/ScoreEntry),
# the attract-screen leaderboard (EnPustTil.drawLeaderboard, scoped to todaySeed) shows
# only day two's scores from that point on — day one's board is left intact in
# scoreboard.json under the old seed, just no longer displayed. The active seed is also
# shown on the attract screen's status line (SEED <n>) as a way to check the switch took
# without reading a log.
#
# THE VALUE MUST BE A WHOLE NUMBER, 2147483647 (Int.MAX_VALUE) OR BELOW — NOT "ten digits
# or fewer": 2147483648 is ten digits too, and throws; 2147483647 is also ten digits and
# is fine. The number itself is the only correct rule. This is not a style preference:
# application.cfg's own loader type-coerces every value before storing it (all-digits ->
# Integer, digits-with-one-dot -> Float, anything else -> String), and going ABOVE
# 2147483647 does not just fail to parse for dailySeed — it throws SILENTLY while the
# whole file is being read (nothing logs it) and aborts parsing PARTWAY THROUGH, dropping
# an UNPREDICTABLE SUBSET of every OTHER key below it too — which subset depends on
# Properties' internal hash order, not on where a key sits in this file, and changes if a
# key is added or removed, so it is not written down here as a fixed list. The cabinet
# does NOT reliably come up windowed or with the wrong log level from this - screenMode
# and logLevel happen to survive it in the current key set, but that is not guaranteed for
# every key going forward. If gameName at the top of this file ever reads back wrong at
# startup, the booth log will say so (EnPustTil.configFileHealthWarning) - that is the
# general symptom to watch for, not a specific list of which keys broke. A decimal point
# is a typo for the same reason a whole number matters (a seed is never fractional) and
# degrades safely on its own - it falls back to whatever seed was already active - but a
# value above 2147483647 does not degrade safely, it corrupts an unknown part of this file.
# dailySeed = 20260903
screenMode = FULLSCREEN
logLevel = WARN

# BUTTON MAP. The booth encoder is a generic USB arcade board and its button codes are a
# guess until one is enumerated on Windows. If kick, bleed or start land on the wrong
# physical button on setup day, change them here and restart the .exe - no rebuild, no
# toolchain. Valid names are GamepadButton's entries, verified against the jar: A, B, X, Y,
# LEFT_BUMPER, RIGHT_BUMPER, BACK, START, GUIDE, LEFT_THUMB, RIGHT_THUMB, DPAD_UP,
# DPAD_RIGHT, DPAD_DOWN, DPAD_LEFT, and the PlayStation aliases CROSS, CIRCLE, SQUARE,
# TRIANGLE. LAST is also accepted (parseGamepadButton has no carve-out for it) but is an
# alias for DPAD_LEFT, not a button of its own - verified from the jar, same construction
# as the PlayStation aliases above - so write DPAD_LEFT instead; LAST works but names
# nothing a technician standing at the cabinet would recognise.
#
# An unknown or misspelled name falls back to the compiled default rather than leaving
# the button unbound - see parseGamepadButton - and the fallback is LOGGED (at WARN, so it
# reaches this file's own logLevel and the booth log written at start-up, booth/BoothLog.kt)
# rather than happening silently: a typo and a deliberate "use the default" edit would
# otherwise be indistinguishable. kickButton and bleedButton landing on the same physical
# button (a copy-paste mistake across adjacent lines) is ALSO logged - as are pauseButton
# landing on either of them and exitButtonA landing on exitButtonB (see the pause/exit
# block below). Those are the only collisions logged, not any two keys in this map:
# kickButton/bleedButton colliding with either restart key, and pauseButton colliding with
# either restart key, are safe, sometimes-deliberate configurations because the two signals
# are never read in the same game state (see gamepadButtonCollisionWarnings' doc for the
# state-by-state argument). Run with EPT_DEV=1 to see which codes the encoder actually reports (the gamepad
# diagnostic overlay) if none of the names below turn out to be it.
# kickButton = A
# bleedButton = B
# restartButton = START
# restartButtonAlt = A
#
# PAUSE AND EXIT ON THE CONTROLLER. pauseButton opens the pause screen the same way Esc on
# a keyboard does; on a DualSense BACK is the Create button, on an Xbox pad it is View. It
# must not be set to kickButton or bleedButton - a player's kick would then open the pause
# screen in the middle of their run - and that specific mistake is logged at WARN like the
# kick/bleed collision above.
#
# EXIT NEEDS BOTH exitButtonA AND exitButtonB HELD TOGETHER, ON THE SAME CONTROLLER, FOR
# 1.5 SECONDS, AND ONLY ON THE PAUSE SCREEN. It closes the game - at the booth that means
# the cabinet is down until someone starts it again, so it is deliberately awkward. Two
# buttons rather than one because a single button would mean one stuck contact ends the
# day: a jammed exit button on a noisy encoder would hold the exit for its 1.5 seconds all
# by itself. With two, a phantom exit needs a phantom pause press first, then two contacts
# stuck at the same moment on the same controller, held together. Releasing either one
# resets the hold to zero. The two must be DIFFERENT buttons (setting both to one button
# quietly turns the pair back into a single button, and is logged at WARN), and neither can
# be pauseButton: pressing pause while paused RESUMES, so an exit hold that included it
# would leave the pause screen before the 1.5 seconds were up and could never fire. Q on a
# keyboard still does the same job on its own, for technicians.
# pauseButton = BACK
# exitButtonA = LEFT_BUMPER
# exitButtonB = RIGHT_BUMPER
#
# stickDeadzone: a whole number ("0" to disable it entirely) or a decimal ("0.2", "0.35",
# ...) both work - clamped to 0..0.9 either way.
# stickDeadzone = 0.2
