gameName = EnPustTil
targetFps = 120

# Booth default: this file ships in the release .exe (buildWin64Release), so it must be
# safe to run unattended in front of a queue for two days. FULLSCREEN removes the title
# bar/close button that any attendee could otherwise drag or close, and a quieter log
# level avoids two days of DEBUG spam. See application-dev.cfg for the local override -
# screenMode and window size cannot be changed at runtime (no setter reaches the window
# once it is created), so this split, not an env var, is what makes booth mode "the
# default for a release build". See EnPustTil.onCreate for the one thing that IS
# runtime-gated (EPT_DEV): MetricViewer, and logLevel as a belt-and-braces on-site
# override even against a built release .exe. No windowWidth/windowHeight here,
# deliberately: FULLSCREEN with no pinned size takes the display's native resolution
# instead of a guessed one, and the game is resolution-independent by construction
# (see render/CameraRig.kt, which derives the world scale from the actual surface height).
#
# DAY TWO: change dailySeed below to a different number and restart the .exe. The
# fresh seed generates a new water column (see dive/PearlColumn.generate/DiveSim),
# and since every score record stores the seed it was earned under (score/ScoreEntry),
# the attract-screen leaderboard (EnPustTil.drawLeaderboard, scoped to todaySeed) shows
# only day two's scores from that point on — day one's board is left intact in
# scoreboard.json under the old seed, just no longer displayed.
# dailySeed = 20260903
screenMode = FULLSCREEN
logLevel = WARN

# BUTTON MAP. The booth encoder is a generic USB arcade board and its button codes are a
# guess until one is enumerated on Windows. If kick, bleed or start land on the wrong
# physical button on setup day, change them here and restart the .exe - no rebuild, no
# toolchain. Valid names are GamepadButton's entries, verified against the jar: A, B, X, Y,
# LEFT_BUMPER, RIGHT_BUMPER, BACK, START, GUIDE, LEFT_THUMB, RIGHT_THUMB, DPAD_UP,
# DPAD_RIGHT, DPAD_DOWN, DPAD_LEFT, and the PlayStation aliases CROSS, CIRCLE, SQUARE,
# TRIANGLE. An unknown
# or misspelled name falls back to the compiled default rather than leaving the button
# unbound - see parseGamepadButton. Run with EPT_DEV=1 to see which codes the encoder
# actually reports (the gamepad diagnostic overlay), or read the booth log written at
# start-up (see booth/BoothLog.kt).
# kickButton = A
# bleedButton = B
# restartButton = START
# restartButtonAlt = A
# stickDeadzone = 0.2
